<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Decisões de manejo para equilibrar produção e preservação.">
  <title>Decisões | Agro forte, futuro sustentável</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body data-pagina="decisoes" data-etapa="3">
  <a class="atalho-conteudo" href="#conteudo">Ir para o conteúdo</a>

  <header class="topo-aplicacao">
    <a class="nome-projeto" href="index.html">Agro forte, futuro sustentável</a>
    <div class="marcador-etapa" aria-label="Etapa atual">
      <span>03/08</span>
      <strong>Decisões</strong>
    </div>
    <div class="acessibilidade" aria-label="Controles de acessibilidade">
      <button type="button" id="botaoTema" aria-pressed="false">Contraste</button>
      <button type="button" id="botaoFonteMenor" aria-label="Diminuir fonte">A-</button>
      <button type="button" id="botaoFonteMaior" aria-label="Aumentar fonte">A+</button>
    </div>
  </header>

  <main id="conteudo" class="quadro-app" tabindex="-1">
    <!-- Decisões: uma situação por vez, sem formulário longo. -->
    <section class="tela-app decisoes">
      <aside class="faixa-situacao">
        <span id="situacaoAtual">Situação 1 de 4</span>
        <ol id="listaSituacoes">
          <li>Água</li>
          <li>Energia</li>
          <li>Solo</li>
          <li>Manejo</li>
        </ol>
      </aside>

      <article class="painel-decisao" aria-live="polite">
        <p class="rotulo-tela" id="contextoSituacao"></p>
        <h1 id="tituloSituacao"></h1>
        <p id="textoSituacao"></p>
        <div class="opcoes-decisao" id="opcoesDecisao"></div>
        <p class="feedback-decisao" id="feedbackDecisao"></p>
        <div class="leitura-opcao" id="leituraOpcao" aria-label="Leitura da decisão"></div>
      </article>

      <aside class="registro-decisoes">
        <h2>Escolhas registradas</h2>
        <div id="registroDecisoes"></div>
      </aside>

      <footer class="acoes-tela">
        <button type="button" id="botaoSituacaoAnterior">Anterior</button>
        <button class="botao-primario" type="button" id="botaoSituacaoProxima">Próxima decisão</button>
      </footer>
    </section>
  </main>
</body>
</html>
