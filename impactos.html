<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Consequências visuais das decisões de manejo.">
  <title>Impactos | Agro forte, futuro sustentável</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body data-pagina="impactos" data-etapa="4">
  <a class="atalho-conteudo" href="#conteudo">Ir para o conteúdo</a>

  <header class="topo-aplicacao">
    <a class="nome-projeto" href="index.html">Agro forte, futuro sustentável</a>
    <div class="marcador-etapa" aria-label="Etapa atual">
      <span>04/08</span>
      <strong>Impactos</strong>
    </div>
    <div class="acessibilidade" aria-label="Controles de acessibilidade">
      <button type="button" id="botaoTema" aria-pressed="false">Contraste</button>
      <button type="button" id="botaoFonteMenor" aria-label="Diminuir fonte">A-</button>
      <button type="button" id="botaoFonteMaior" aria-label="Aumentar fonte">A+</button>
    </div>
  </header>

  <main id="conteudo" class="quadro-app" tabindex="-1">
    <!-- Impactos: consequências em blocos visuais, sem depender de porcentagens. -->
    <section class="tela-app impactos">
      <header class="cabeca-tela compacto">
        <p class="rotulo-tela">consequências</p>
        <h1 id="tituloImpacto">Leitura do sistema</h1>
      </header>

      <div class="matriz-impactos" id="mapaImpactos" aria-label="Ganhos, perdas, riscos e melhorias">
        <article class="zona-impacto ganhos">
          <div class="cabecalho-impacto">
            <span>ganhos</span>
            <strong class="intensidade-impacto" id="forcaGanhos">em leitura</strong>
          </div>
          <ul id="listaGanhos"></ul>
        </article>
        <article class="zona-impacto perdas">
          <div class="cabecalho-impacto">
            <span>perdas</span>
            <strong class="intensidade-impacto" id="forcaPerdas">em leitura</strong>
          </div>
          <ul id="listaPerdas"></ul>
        </article>
        <article class="zona-impacto riscos">
          <div class="cabecalho-impacto">
            <span>riscos</span>
            <strong class="intensidade-impacto" id="forcaRiscos">em leitura</strong>
          </div>
          <ul id="listaRiscos"></ul>
        </article>
        <article class="zona-impacto melhorias">
          <div class="cabecalho-impacto">
            <span>melhorias</span>
            <strong class="intensidade-impacto" id="forcaMelhorias">em leitura</strong>
          </div>
          <ul id="listaMelhorias"></ul>
        </article>
      </div>

      <p class="leitura-curta" id="textoImpacto"></p>

      <div class="cadeia-impactos" id="cadeiaImpactos" aria-label="Cadeia entre decisões e consequências"></div>

      <footer class="acoes-tela">
        <a href="decisoes.html">Rever decisões</a>
        <a class="botao-primario" href="comparacao.html">Comparar cenários</a>
      </footer>
    </section>
  </main>
</body>
</html>
