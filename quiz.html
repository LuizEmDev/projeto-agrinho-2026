<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Quiz integrado à jornada educativa.">
  <title>Quiz | Agro forte, futuro sustentável</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body data-pagina="quiz" data-etapa="6">
  <a class="atalho-conteudo" href="#conteudo">Ir para o conteúdo</a>

  <header class="topo-aplicacao">
    <a class="nome-projeto" href="index.html">Agro forte, futuro sustentável</a>
    <div class="marcador-etapa" aria-label="Etapa atual">
      <span>06/08</span>
      <strong>Quiz</strong>
    </div>
    <div class="acessibilidade" aria-label="Controles de acessibilidade">
      <button type="button" id="botaoTema" aria-pressed="false">Contraste</button>
      <button type="button" id="botaoFonteMenor" aria-label="Diminuir fonte">A-</button>
      <button type="button" id="botaoFonteMaior" aria-label="Aumentar fonte">A+</button>
    </div>
  </header>

  <main id="conteudo" class="quadro-app" tabindex="-1">
    <!-- Quiz: etapa integrada ao percurso, com feedback imediato. -->
    <section class="tela-app quiz">
      <aside class="estado-quiz">
        <span id="andamentoQuiz">Pergunta 1 de 5</span>
        <strong id="pontuacaoQuiz">0 pontos</strong>
        <p id="contextoQuiz">Use o diagnóstico e suas decisões para responder.</p>
      </aside>

      <article class="pergunta-quiz">
        <p class="rotulo-tela">verificação</p>
        <h1 id="perguntaQuiz"></h1>
        <div class="opcoes-quiz" id="opcoesQuiz"></div>
        <p class="feedback" id="feedbackQuiz" aria-live="polite"></p>
      </article>

      <footer class="acoes-tela">
        <a href="comparacao.html">Voltar</a>
        <button class="botao-primario" type="button" id="proximaPergunta" disabled>Próxima</button>
      </footer>
    </section>
  </main>
</body>
</html>
